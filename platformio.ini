; PackSense firmware for the RT-Thread RT-Spark (STM32F407ZGT6, board HW1.1).
; Hardware facts used here come from docs/hardware/pinmap.md (schematic HW1.1).

[platformio]
default_envs = rt_spark

[env:rt_spark]
platform = ststm32@20.0.0
framework = stm32cube
board = rt_spark
board_build.ldscript = linker/STM32F407ZGTx_FLASH.ld   ; ST script + .ccmram (NOLOAD)
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_filters = time, log2file   ; timestamped lines, saved to logs/device-monitor-*.log

; HSE_VALUE: X2 is an 8 MHz crystal (schematic sheet 5/10, pinmap.md "Clocks").
; -O2 replaces the framework's default -Os (build_unflags) for predictable timing.
build_flags =
  -DUSE_HAL_DRIVER
  -DHSE_VALUE=8000000U
  -mfpu=fpv4-sp-d16 -mfloat-abi=hard
  -O2 -g
  -Iinclude
  -Ilib/FreeRTOS/include
  -Ilib/FreeRTOS/portable/GCC/ARM_CM4F
  -Wl,--print-memory-usage
build_unflags = -Os
; Warnings apply to our own sources only; vendored HAL/FreeRTOS are not edited.
build_src_flags =
  -Wall -Wextra -Wshadow -Wundef -Wdouble-promotion
build_src_filter = +<*>
extra_scripts =
  pre:tools/pio_fpu_link.py   ; pass FPU flags to the linker and assembler as well
  pre:tools/pio_git_rev.py    ; embed the git revision in the boot banner
